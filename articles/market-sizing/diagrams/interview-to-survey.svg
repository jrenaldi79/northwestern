<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="Georgia, 'Times New Roman', serif">
  <rect width="820" height="420" fill="#FAFAFA"/>
  <rect x="0" y="0" width="820" height="3" fill="#5B21B6"/>

  <defs>
    <marker id="flowArr" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5" fill="#D4D4D8"/>
    </marker>
  </defs>

  <text x="50" y="36" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:10px; font-weight:500; fill:#A1A1AA; letter-spacing:0.12em;">RESEARCH CONNECTION</text>
  <text x="50" y="66" style="font-size:26px; font-weight:400; fill:#0A0A0B; letter-spacing:-0.03em;">From Interviews to Survey to Model</text>
  <line x1="50" y1="78" x2="130" y2="78" stroke="#5B21B6" stroke-width="1.5" opacity="0.4"/>

  <!-- Column headers -->
  <rect x="25" y="94" width="225" height="26" rx="4" fill="#5B21B6"/>
  <text x="137" y="112" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:10px; font-weight:600; fill:#FFFFFF; letter-spacing:0.08em;">CUSTOMER INTERVIEWS</text>

  <rect x="298" y="94" width="225" height="26" rx="4" fill="#0891B2"/>
  <text x="410" y="112" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:10px; font-weight:600; fill:#FFFFFF; letter-spacing:0.08em;">SURVEY QUESTIONS</text>

  <rect x="571" y="94" width="225" height="26" rx="4" fill="#27272A"/>
  <text x="683" y="112" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:10px; font-weight:600; fill:#FFFFFF; letter-spacing:0.08em;">MODEL INPUTS</text>

  <!-- Row 1 -->
  <rect x="25" y="130" width="225" height="44" rx="4" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="0.5"/>
  <text x="137" y="149" text-anchor="middle" style="font-size:11px; fill:#3F3F46; font-style:italic;">"I worry about this constantly"</text>
  <text x="137" y="164" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:9px; fill:#A1A1AA;">Problem intensity signal</text>

  <line x1="250" y1="152" x2="293" y2="152" stroke="#D4D4D8" stroke-width="1" marker-end="url(#flowArr)"/>

  <rect x="298" y="130" width="225" height="44" rx="4" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="0.5"/>
  <text x="410" y="149" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:11px; font-weight:600; fill:#0891B2;">Concern intensity scale (1–7)</text>
  <text x="410" y="164" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:9px; fill:#A1A1AA;">Problem frequency questions</text>

  <line x1="523" y1="152" x2="566" y2="152" stroke="#D4D4D8" stroke-width="1" marker-end="url(#flowArr)"/>

  <rect x="571" y="130" width="225" height="44" rx="4" fill="rgba(91, 33, 182, 0.04)" stroke="rgba(91, 33, 182, 0.12)" stroke-width="0.5"/>
  <text x="683" y="149" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:11px; font-weight:600; fill:#5B21B6;">Urgency/Severity Filter %</text>
  <text x="683" y="164" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:9px; fill:#71717A;">Defines your target segment</text>

  <!-- Row 2 -->
  <rect x="25" y="184" width="225" height="44" rx="4" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="0.5"/>
  <text x="137" y="203" text-anchor="middle" style="font-size:11px; fill:#3F3F46; font-style:italic;">"Current solutions are terrible"</text>
  <text x="137" y="218" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:9px; fill:#A1A1AA;">Dissatisfaction signal</text>

  <line x1="250" y1="206" x2="293" y2="206" stroke="#D4D4D8" stroke-width="1" marker-end="url(#flowArr)"/>

  <rect x="298" y="184" width="225" height="44" rx="4" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="0.5"/>
  <text x="410" y="203" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:11px; font-weight:600; fill:#0891B2;">Concept preference ranking</text>
  <text x="410" y="218" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:9px; fill:#A1A1AA;">Satisfaction with alternatives</text>

  <line x1="523" y1="206" x2="566" y2="206" stroke="#D4D4D8" stroke-width="1" marker-end="url(#flowArr)"/>

  <rect x="571" y="184" width="225" height="44" rx="4" fill="rgba(91, 33, 182, 0.04)" stroke="rgba(91, 33, 182, 0.12)" stroke-width="0.5"/>
  <text x="683" y="203" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:11px; font-weight:600; fill:#5B21B6;">Adoption Likelihood Filter %</text>
  <text x="683" y="218" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:9px; fill:#71717A;">Interested vs. would actually switch</text>

  <!-- Row 3 -->
  <rect x="25" y="238" width="225" height="44" rx="4" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="0.5"/>
  <text x="137" y="257" text-anchor="middle" style="font-size:11px; fill:#3F3F46; font-style:italic;">"I'd pay for something like this"</text>
  <text x="137" y="272" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:9px; fill:#A1A1AA;">Willingness to pay signal</text>

  <line x1="250" y1="260" x2="293" y2="260" stroke="#D4D4D8" stroke-width="1" marker-end="url(#flowArr)"/>

  <rect x="298" y="238" width="225" height="44" rx="4" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="0.5"/>
  <text x="410" y="257" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:11px; font-weight:600; fill:#0891B2;">Price sensitivity / WTP range</text>
  <text x="410" y="272" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:9px; fill:#A1A1AA;">Current spend on alternatives</text>

  <line x1="523" y1="260" x2="566" y2="260" stroke="#D4D4D8" stroke-width="1" marker-end="url(#flowArr)"/>

  <rect x="571" y="238" width="225" height="44" rx="4" fill="rgba(91, 33, 182, 0.04)" stroke="rgba(91, 33, 182, 0.12)" stroke-width="0.5"/>
  <text x="683" y="257" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:11px; font-weight:600; fill:#5B21B6;">Revenue per User</text>
  <text x="683" y="272" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:9px; fill:#71717A;">Pricing model input</text>

  <!-- Row 4 -->
  <rect x="25" y="292" width="225" height="44" rx="4" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="0.5"/>
  <text x="137" y="311" text-anchor="middle" style="font-size:11px; fill:#3F3F46; font-style:italic;">"My whole family would use it"</text>
  <text x="137" y="326" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:9px; fill:#A1A1AA;">Usage density signal</text>

  <line x1="250" y1="314" x2="293" y2="314" stroke="#D4D4D8" stroke-width="1" marker-end="url(#flowArr)"/>

  <rect x="298" y="292" width="225" height="44" rx="4" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="0.5"/>
  <text x="410" y="311" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:11px; font-weight:600; fill:#0891B2;">Household/org usage count</text>
  <text x="410" y="326" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:9px; fill:#A1A1AA;">Multiplier questions</text>

  <line x1="523" y1="314" x2="566" y2="314" stroke="#D4D4D8" stroke-width="1" marker-end="url(#flowArr)"/>

  <rect x="571" y="292" width="225" height="44" rx="4" fill="rgba(91, 33, 182, 0.04)" stroke="rgba(91, 33, 182, 0.12)" stroke-width="0.5"/>
  <text x="683" y="311" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:11px; font-weight:600; fill:#5B21B6;">Users per Unit Multiplier</text>
  <text x="683" y="326" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:9px; fill:#71717A;">Density ratio</text>

  <!-- Row 5 -->
  <rect x="25" y="346" width="225" height="44" rx="4" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="0.5"/>
  <text x="137" y="365" text-anchor="middle" style="font-size:11px; fill:#3F3F46; font-style:italic;">"Everyone in my group talks..."</text>
  <text x="137" y="380" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:9px; fill:#A1A1AA;">Word of Mouth signal</text>

  <line x1="250" y1="368" x2="293" y2="368" stroke="#D4D4D8" stroke-width="1" marker-end="url(#flowArr)"/>

  <rect x="298" y="346" width="225" height="44" rx="4" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="0.5"/>
  <text x="410" y="365" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:11px; font-weight:600; fill:#0891B2;">Network/community questions</text>
  <text x="410" y="380" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:9px; fill:#A1A1AA;">Referral behavior</text>

  <line x1="523" y1="368" x2="566" y2="368" stroke="#D4D4D8" stroke-width="1" marker-end="url(#flowArr)"/>

  <rect x="571" y="346" width="225" height="44" rx="4" fill="rgba(91, 33, 182, 0.04)" stroke="rgba(91, 33, 182, 0.12)" stroke-width="0.5"/>
  <text x="683" y="365" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:11px; font-weight:600; fill:#5B21B6;">WOM Validation</text>
  <text x="683" y="380" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:9px; fill:#71717A;">Beachhead selection input</text>

  <!-- Footer -->
  <line x1="25" y1="400" x2="796" y2="400" stroke="#E4E4E7" stroke-width="0.5"/>
  <text x="25" y="414" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:9px; fill:#A1A1AA; letter-spacing:0.1em;">MPD CAPSTONE GUIDE</text>
  <text x="796" y="414" text-anchor="end" font-family="'IBM Plex Mono', monospace" style="font-size:9px; fill:#A1A1AA;">05 / Research Connection</text>
</svg>