  <line x1="646" y1="254" x2="654" y2="272" stroke="#14b8a6" stroke-width="0.7" opacity="0.25"/>
  <line x1="700" y1="246" x2="668" y2="274" stroke="#14b8a6" stroke-width="0.7" opacity="0.2"/>
  <line x1="672" y1="280" x2="712" y2="274" stroke="#14b8a6" stroke-width="0.6" opacity="0.2"/>

  <!-- "N more accounts" indicator -->
  <rect x="430" y="324" width="325" height="22" rx="4" fill="rgba(20, 184, 166, 0.04)" stroke="rgba(20, 184, 166, 0.15)" stroke-width="0.6"/>
  <!-- Mini cluster dots -->
  <circle cx="454" cy="335" r="3.5" fill="rgba(20, 184, 166, 0.18)" stroke="#14b8a6" stroke-width="0.5"/>
  <circle cx="463" cy="332" r="2.5" fill="rgba(20, 184, 166, 0.12)" stroke="#14b8a6" stroke-width="0.4"/>
  <circle cx="459" cy="339" r="2" fill="rgba(20, 184, 166, 0.1)" stroke="#14b8a6" stroke-width="0.3"/>

  <circle cx="484" cy="335" r="3.5" fill="rgba(20, 184, 166, 0.18)" stroke="#14b8a6" stroke-width="0.5"/>
  <circle cx="493" cy="332" r="2.5" fill="rgba(20, 184, 166, 0.12)" stroke="#14b8a6" stroke-width="0.4"/>
  <circle cx="489" cy="339" r="2" fill="rgba(20, 184, 166, 0.1)" stroke="#14b8a6" stroke-width="0.3"/>

  <circle cx="514" cy="335" r="3.5" fill="rgba(20, 184, 166, 0.18)" stroke="#14b8a6" stroke-width="0.5"/>
  <circle cx="523" cy="332" r="2.5" fill="rgba(20, 184, 166, 0.12)" stroke="#14b8a6" stroke-width="0.4"/>
  <circle cx="519" cy="339" r="2" fill="rgba(20, 184, 166, 0.1)" stroke="#14b8a6" stroke-width="0.3"/>

  <text x="542" y="338" style="font-size:8px; font-weight:500; fill:#52525B;">+ hundreds more isolated per-account graphs</text>

  <!-- Feed sources (bottom of Customer Brain) -->
  <rect x="430" y="352" width="325" height="24" rx="4" fill="rgba(20, 184, 166, 0.04)" stroke="rgba(20, 184, 166, 0.15)" stroke-width="0.6"/>
  <text x="460" y="368" style="font-size:8px; font-weight:500; fill:#52525B;">💬 Conversations</text>
  <text x="575" y="368" style="font-size:8px; font-weight:500; fill:#52525B;">💳 Transactions</text>
  <text x="680" y="368" style="font-size:8px; font-weight:500; fill:#52525B;">🎫 Tickets</text>


  <!-- ============================================ -->
  <!-- BOTTOM: Convergence — both feed into agent   -->
  <!-- ============================================ -->
  <!-- Down arrows from both brains — BOLD, with proper arrowheads -->
  <line x1="210" y1="382" x2="340" y2="404" stroke="#6366f1" stroke-width="2" opacity="0.5"/>
  <polygon points="341,409 350,405 343,399" fill="#6366f1" opacity="0.5"/>
  <line x1="590" y1="382" x2="464" y2="404" stroke="#14b8a6" stroke-width="2" opacity="0.5"/>
  <polygon points="463,409 454,405 461,399" fill="#14b8a6" opacity="0.5"/>

  <!-- Agent box -->
