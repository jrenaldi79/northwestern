  <text x="400" y="418" text-anchor="middle" style="font-size:11px; font-weight:700; fill:#5B21B6;">AI Agent</text>

  <!-- Insight callout -->
  <text x="400" y="438" text-anchor="middle" style="font-size:8px; fill:#52525B; font-style:italic;">"Usage dropped 40% after the UI change. Renewal is in 6 weeks. Flag to account manager."</text>
</svg>