<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'DM Sans', 'Outfit', system-ui, sans-serif">
  <!--
    Dual Knowledge Base: Company Brain vs Customer Brain
    Design system: Northwestern editorial (FAFAFA paper, zinc ink, thin strokes)
    Company Brain = purple/indigo tones, Customer Brain = teal/green tones
    v2: Fixed fonts (all sans-serif), bolder arrows, better contrast, larger labels
  -->

  <!-- No marker defs — using inline polygon arrowheads for clean rendering -->

  <!-- Background -->
  <rect width="800" height="440" fill="#f8f9fc"/>
  <rect x="0" y="0" width="800" height="3" fill="#5B21B6"/>

  <!-- Section label -->
  <text x="40" y="30" style="font-size:9px; font-weight:500; fill:#A1A1AA; letter-spacing:0.12em;">DUAL KNOWLEDGE BASE</text>

  <!-- Title -->
  <text x="40" y="56" style="font-size:22px; font-weight:600; fill:#0A0A0B; letter-spacing:-0.03em;">Two Brains, One Intelligence Layer</text>

  <!-- Thin accent divider -->
  <line x1="40" y1="66" x2="120" y2="66" stroke="#5B21B6" stroke-width="2" opacity="0.4"/>

  <!-- ============================================ -->
  <!-- SHARED INPUT ROW                             -->
  <!-- ============================================ -->
  <rect x="40" y="80" width="720" height="28" rx="5" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="0.8"/>
  <text x="400" y="98" text-anchor="middle" style="font-size:11px; font-weight:500; fill:#52525B;">All organizational data flows in: documents, conversations, transactions, meetings</text>

  <!-- Down arrows splitting left and right — BOLD, color-coded -->
  <line x1="300" y1="108" x2="218" y2="128" stroke="#6366f1" stroke-width="2" opacity="0.6"/>
  <polygon points="217,133 208,130 215,123" fill="#6366f1" opacity="0.6"/>
  <line x1="500" y1="108" x2="582" y2="128" stroke="#14b8a6" stroke-width="2" opacity="0.6"/>
  <polygon points="583,133 592,130 585,123" fill="#14b8a6" opacity="0.6"/>

  <!-- Splitter label — more prominent -->
  <rect x="352" y="108" width="96" height="20" rx="4" fill="rgba(91, 33, 182, 0.08)" stroke="rgba(91, 33, 182, 0.25)" stroke-width="0.8"/>
  <text x="400" y="122" text-anchor="middle" style="font-size:9px; font-weight:700; fill:#5B21B6; letter-spacing:0.06em;">PARTITIONED</text>

  <!-- ============================================ -->
  <!-- ISOLATION WALL (center divider) — BOLD       -->
  <!-- ============================================ -->
  <line x1="400" y1="136" x2="400" y2="382" stroke="#D4D4D8" stroke-width="2" stroke-dasharray="8,5"/>
  <rect x="380" y="248" width="40" height="22" rx="4" fill="#f0f0f5" stroke="#A1A1AA" stroke-width="0.8"/>
  <text x="400" y="263" text-anchor="middle" font-family="'IBM Plex Mono', monospace" style="font-size:8px; font-weight:600; fill:#71717A; letter-spacing:0.06em;">WALL</text>

  <!-- ============================================ -->
  <!-- LEFT: COMPANY BRAIN                          -->
  <!-- ============================================ -->
  <rect x="40" y="136" width="345" height="246" rx="8" fill="#FFFFFF" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1"/>

  <!-- Header -->
  <rect x="40" y="136" width="345" height="34" rx="8" fill="rgba(99, 102, 241, 0.07)"/>
  <rect x="40" y="162" width="345" height="8" fill="rgba(99, 102, 241, 0.07)"/>
  <line x1="40" y1="170" x2="385" y2="170" stroke="rgba(99, 102, 241, 0.2)" stroke-width="0.5"/>

  <!-- Brain icon -->
  <circle cx="62" cy="153" r="9" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1"/>
  <text x="62" y="157" text-anchor="middle" style="font-size:10px; fill:#6366f1;">🧠</text>

  <text x="80" y="158" style="font-size:14px; font-weight:700; fill:#27272A; letter-spacing:-0.01em;">Company Brain</text>
  <text x="230" y="157" style="font-size:9px; font-weight:400; fill:#71717A;">What we know about ourselves</text>

  <!-- Descriptors -->
  <text x="60" y="188" font-family="'IBM Plex Mono', monospace" style="font-size:8px; fill:#6366f1; letter-spacing:0.04em;">UPDATES WEEKLY · WHOLE TEAM READS</text>

