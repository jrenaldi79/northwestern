  <line x1="484" y1="254" x2="494" y2="268" stroke="#14b8a6" stroke-width="0.7" opacity="0.25"/>
  <line x1="535" y1="244" x2="508" y2="270" stroke="#14b8a6" stroke-width="0.7" opacity="0.2"/>
  <line x1="512" y1="278" x2="546" y2="272" stroke="#14b8a6" stroke-width="0.6" opacity="0.2"/>

  <!-- Customer B cluster -->
  <rect x="592" y="200" width="155" height="118" rx="6" fill="rgba(20, 184, 166, 0.025)" stroke="rgba(20, 184, 166, 0.18)" stroke-width="0.7" stroke-dasharray="4,3"/>
  <text x="598" y="213" font-family="'IBM Plex Mono', monospace" style="font-size:7px; font-weight:600; fill:#0d9488;">Globex Inc</text>

  <!-- Globex nodes -->
  <circle cx="640" cy="242" r="13" fill="rgba(20, 184, 166, 0.12)" stroke="#14b8a6" stroke-width="1"/>
  <text x="640" y="246" text-anchor="middle" style="font-size:7px; font-weight:500; fill:#0d9488;">Usage</text>

  <circle cx="700" cy="234" r="12" fill="rgba(20, 184, 166, 0.1)" stroke="#14b8a6" stroke-width="0.9"/>
  <text x="700" y="238" text-anchor="middle" style="font-size:7px; font-weight:500; fill:#0d9488;">Tickets</text>

  <circle cx="660" cy="280" r="12" fill="rgba(20, 184, 166, 0.1)" stroke="#14b8a6" stroke-width="0.9"/>
  <text x="660" y="284" text-anchor="middle" style="font-size:6.5px; font-weight:500; fill:#0d9488;">Renewal</text>

  <circle cx="720" cy="272" r="9" fill="rgba(20, 184, 166, 0.07)" stroke="#5eead4" stroke-width="0.7"/>
  <text x="720" y="276" text-anchor="middle" style="font-size:5.5px; font-weight:500; fill:#0d9488;">Requests</text>

  <!-- Globex edges -->
