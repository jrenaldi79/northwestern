  <!-- Edges (behind nodes) -->
  <line x1="105" y1="220" x2="150" y2="244" stroke="#6366f1" stroke-width="1" opacity="0.25"/>
  <line x1="250" y1="224" x2="182" y2="244" stroke="#6366f1" stroke-width="1" opacity="0.25"/>
  <line x1="155" y1="267" x2="112" y2="284" stroke="#6366f1" stroke-width="0.8" opacity="0.2"/>
  <line x1="173" y1="265" x2="235" y2="288" stroke="#6366f1" stroke-width="0.8" opacity="0.2"/>
  <line x1="260" y1="232" x2="305" y2="258" stroke="#6366f1" stroke-width="0.8" opacity="0.18"/>
  <line x1="165" y1="268" x2="172" y2="310" stroke="#6366f1" stroke-width="0.7" opacity="0.18"/>
  <line x1="80" y1="258" x2="92" y2="278" stroke="#6366f1" stroke-width="0.7" opacity="0.18"/>
  <line x1="82" y1="252" x2="94" y2="228" stroke="#6366f1" stroke-width="0.7" opacity="0.18"/>
  <line x1="114" y1="292" x2="163" y2="312" stroke="#6366f1" stroke-width="0.6" opacity="0.15"/>
  <line x1="250" y1="300" x2="302" y2="272" stroke="#6366f1" stroke-width="0.6" opacity="0.15"/>

  <!-- Central strategy node (largest) -->
  <circle cx="165" cy="252" r="20" fill="rgba(99, 102, 241, 0.12)" stroke="#6366f1" stroke-width="1.5"/>
  <text x="165" y="256" text-anchor="middle" style="font-size:9px; font-weight:600; fill:#4f46e5;">Strategy</text>

  <!-- Roadmap node -->
  <circle cx="95" cy="218" r="14" fill="rgba(99, 102, 241, 0.09)" stroke="#6366f1" stroke-width="1"/>
  <text x="95" y="222" text-anchor="middle" style="font-size:7.5px; font-weight:500; fill:#4f46e5;">Roadmap</text>

  <!-- Pricing node -->
  <circle cx="258" cy="218" r="14" fill="rgba(99, 102, 241, 0.09)" stroke="#6366f1" stroke-width="1"/>
  <text x="258" y="222" text-anchor="middle" style="font-size:7.5px; font-weight:500; fill:#4f46e5;">Pricing</text>

  <!-- Playbook node -->
  <circle cx="102" cy="290" r="13" fill="rgba(99, 102, 241, 0.07)" stroke="#818cf8" stroke-width="0.9"/>
  <text x="102" y="294" text-anchor="middle" style="font-size:7px; font-weight:500; fill:#6366f1;">Playbook</text>

