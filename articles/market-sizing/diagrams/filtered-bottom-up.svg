<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="Georgia, 'Times New Roman', serif">
  <rect width="720" height="500" fill="#FAFAFA"/>
  <rect x="0" y="0" width="720" height="3" fill="#5B21B6"/>

  <text x="50" y="38" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:10px; font-weight:500; fill:#A1A1AA; letter-spacing:0.12em;">METHODOLOGY</text>
  <text x="50" y="72" style="font-size:30px; font-weight:400; fill:#0A0A0B; letter-spacing:-0.03em;">The Filtered Bottom-Up Model</text>
  <text x="50" y="94" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:13px; font-weight:400; fill:#71717A; letter-spacing:-0.01em;">Start broad. Apply sourced filters. Arrive at your market size.</text>
  <line x1="50" y1="108" x2="130" y2="108" stroke="#5B21B6" stroke-width="1.5" opacity="0.4"/>

  <!-- Funnel steps -->
  <!-- Step 1: Base Population -->
  <rect x="55" y="125" width="610" height="48" rx="4" fill="#5B21B6"/>
  <text x="360" y="148" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:14px; font-weight:600; fill:#FFFFFF; letter-spacing:0.05em;">BASE POPULATION</text>
  <text x="360" y="164" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:10px; font-weight:400; fill:rgba(255,255,255,0.7);">Broadest verifiable count from a credible public source (Census, BLS, etc.)</text>

  <!-- Filter 1 -->
  <text x="360" y="194" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:12px; font-weight:600; fill:#3F3F46;">× Filter 1 (Demographic)</text>
  <text x="360" y="208" text-anchor="middle" font-family="'IBM Plex Mono', monospace" style="font-size:9px; fill:#A1A1AA; letter-spacing:0.02em;">Source: Census data, industry databases</text>
  <polygon points="352,212 360,222 368,212" fill="#D4D4D8"/>

  <!-- Step 2 -->
  <rect x="100" y="228" width="520" height="44" rx="4" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1"/>
  <text x="360" y="250" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:13px; font-weight:600; fill:#27272A; letter-spacing:0.02em;">FILTERED POPULATION</text>
  <text x="360" y="264" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:10px; font-weight:400; fill:#71717A;">Narrowed by age, income, geography, company size</text>

  <!-- Filter 2 -->
  <text x="360" y="293" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:12px; font-weight:600; fill:#3F3F46;">× Filter 2 (Behavioral / Interest)</text>
  <text x="360" y="307" text-anchor="middle" font-family="'IBM Plex Mono', monospace" style="font-size:9px; fill:#A1A1AA; letter-spacing:0.02em;">Source: your survey, published research</text>
  <polygon points="352,311 360,321 368,311" fill="#D4D4D8"/>

  <!-- Step 3 -->
  <rect x="150" y="327" width="420" height="44" rx="4" fill="rgba(91, 33, 182, 0.04)" stroke="rgba(91, 33, 182, 0.15)" stroke-width="1"/>
  <text x="360" y="349" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:13px; font-weight:600; fill:#5B21B6; letter-spacing:0.02em;">TARGET SEGMENT</text>
  <text x="360" y="363" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:10px; font-weight:400; fill:#7C3AED;">People who fit your profile AND have the problem</text>

  <!-- Revenue multiplier -->
  <text x="360" y="392" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:12px; font-weight:600; fill:#3F3F46;">× Users per Unit × Revenue per User</text>
  <text x="360" y="406" text-anchor="middle" font-family="'IBM Plex Mono', monospace" style="font-size:9px; fill:#A1A1AA; letter-spacing:0.02em;">Source: survey, pricing research, comparables</text>
  <polygon points="352,410 360,420 368,410" fill="#D4D4D8"/>

  <!-- Result -->
  <rect x="200" y="426" width="320" height="44" rx="4" fill="#5B21B6"/>
  <text x="360" y="447" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:14px; font-weight:600; fill:#FFFFFF; letter-spacing:0.05em;">BOTTOM-UP MARKET SIZE</text>
  <text x="360" y="462" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:10px; font-weight:400; fill:rgba(255,255,255,0.7);">Your defensible SAM number</text>

  <!-- Left sidebar annotation -->
  <line x1="30" y1="135" x2="30" y2="460" stroke="#D4D4D8" stroke-width="0.5"/>
  <circle cx="30" cy="135" r="2" fill="#5B21B6"/>
  <circle cx="30" cy="460" r="2" fill="#5B21B6"/>
  <text x="18" y="300" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:9px; fill:#A1A1AA; letter-spacing:0.1em;" transform="rotate(-90, 18, 300)">EVERY FILTER NEEDS A SOURCE</text>

  <!-- Right sidebar annotation -->
  <line x1="690" y1="135" x2="690" y2="460" stroke="#D4D4D8" stroke-width="0.5"/>
  <circle cx="690" cy="135" r="2" fill="#8B5CF6"/>
  <circle cx="690" cy="460" r="2" fill="#8B5CF6"/>
  <text x="702" y="300" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:9px; fill:#A1A1AA; letter-spacing:0.1em;" transform="rotate(90, 702, 300)">UNCERTAINTY COMPOUNDS</text>

  <!-- Footer -->
  <line x1="50" y1="482" x2="670" y2="482" stroke="#E4E4E7" stroke-width="0.5"/>
  <text x="50" y="496" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:9px; fill:#A1A1AA; letter-spacing:0.1em;">MPD CAPSTONE GUIDE</text>
  <text x="670" y="496" text-anchor="end" font-family="'IBM Plex Mono', monospace" style="font-size:9px; fill:#A1A1AA;">02 / Methodology</text>
</svg>