<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Georgia, 'Times New Roman', serif">
  <rect width="760" height="560" fill="#FAFAFA"/>
  <rect x="0" y="0" width="760" height="3" fill="#5B21B6"/>

  <text x="50" y="38" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:10px; font-weight:500; fill:#A1A1AA; letter-spacing:0.12em;">CASE STUDY</text>
  <text x="50" y="72" style="font-size:30px; font-weight:400; fill:#0A0A0B; letter-spacing:-0.03em;">Jiobit: Bottom-Up SAM</text>
  <text x="50" y="94" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:13px; font-weight:400; fill:#71717A;">Every input sourced. No "if we get 1%" hand-waving.</text>
  <line x1="50" y1="108" x2="130" y2="108" stroke="#5B21B6" stroke-width="1.5" opacity="0.4"/>

  <!-- Confidence legend -->
  <rect x="560" y="28" width="170" height="78" rx="4" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="0.5"/>
  <text x="575" y="46" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:9px; font-weight:600; fill:#3F3F46; letter-spacing:0.08em;">CONFIDENCE KEY</text>
  <circle cx="580" cy="62" r="4" fill="#059669"/><text x="592" y="65" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:10px; fill:#52525B;">Sourced Fact</text>
  <circle cx="580" cy="80" r="4" fill="#0891B2"/><text x="592" y="83" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:10px; fill:#52525B;">Research-Derived</text>
  <circle cx="580" cy="98" r="4" fill="#D97706"/><text x="592" y="101" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:10px; fill:#52525B;">Interview/Survey</text>

  <!-- Step 1 -->
  <rect x="170" y="125" width="420" height="62" rx="4" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1"/>
  <circle cx="193" cy="148" r="12" fill="#5B21B6"/>
  <text x="193" y="152" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:12px; font-weight:700; fill:#fff;">1</text>
  <text x="216" y="146" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:12px; font-weight:600; fill:#27272A;">Base Population</text>
  <text x="216" y="164" style="font-size:18px; font-weight:400; fill:#5B21B6;">22.6M households</text>
  <text x="216" y="180" font-family="'IBM Plex Mono', monospace" style="font-size:9px; fill:#A1A1AA;">US households, children &lt;18, income &gt;$40k · Census ACS</text>
  <circle cx="575" cy="142" r="4" fill="#059669"/>

  <!-- Arrow + multiplier -->
  <line x1="380" y1="187" x2="380" y2="206" stroke="#D4D4D8" stroke-width="1"/>
  <polygon points="374,204 380,213 386,204" fill="#D4D4D8"/>
  <text x="400" y="204" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:13px; font-weight:600; fill:#3F3F46;">× 41.7%</text>

  <!-- Step 2 -->
  <rect x="195" y="218" width="370" height="62" rx="4" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1"/>
  <circle cx="218" cy="241" r="12" fill="#5B21B6"/>
  <text x="218" y="245" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:12px; font-weight:700; fill:#fff;">2</text>
  <text x="241" y="239" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:12px; font-weight:600; fill:#27272A;">Filter: Children ages 3–10</text>
  <text x="241" y="257" style="font-size:18px; font-weight:400; fill:#5B21B6;">9.42M households</text>
  <text x="241" y="273" font-family="'IBM Plex Mono', monospace" style="font-size:9px; fill:#A1A1AA;">Census Bureau 2012</text>
  <circle cx="550" cy="235" r="4" fill="#059669"/>

  <!-- Arrow + multiplier -->
  <line x1="380" y1="280" x2="380" y2="299" stroke="#D4D4D8" stroke-width="1"/>
  <polygon points="374,297 380,306 386,297" fill="#D4D4D8"/>
  <text x="400" y="297" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:13px; font-weight:600; fill:#3F3F46;">× 65%</text>

  <!-- Step 3 -->
  <rect x="220" y="311" width="320" height="62" rx="4" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1"/>
  <circle cx="243" cy="334" r="12" fill="#5B21B6"/>
  <text x="243" y="338" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:12px; font-weight:700; fill:#fff;">3</text>
  <text x="266" y="332" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:12px; font-weight:600; fill:#27272A;">Filter: Interest in wearable tracking</text>
  <text x="266" y="350" style="font-size:18px; font-weight:400; fill:#5B21B6;">6.13M households</text>
  <text x="266" y="366" font-family="'IBM Plex Mono', monospace" style="font-size:9px; fill:#A1A1AA;">Family tech study (n=588), Dec 2015</text>
  <circle cx="525" cy="328" r="4" fill="#0891B2"/>

  <!-- Arrow + multiplier -->
  <line x1="380" y1="373" x2="380" y2="392" stroke="#D4D4D8" stroke-width="1"/>
  <polygon points="374,390 380,399 386,390" fill="#D4D4D8"/>
  <text x="400" y="390" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:13px; font-weight:600; fill:#3F3F46;">× 2.2 children/hh</text>

  <!-- Step 4 -->
  <rect x="245" y="404" width="270" height="50" rx="4" fill="rgba(91, 33, 182, 0.04)" stroke="rgba(91, 33, 182, 0.15)" stroke-width="1"/>
  <circle cx="268" cy="425" r="12" fill="#7C3AED"/>
  <text x="268" y="429" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:12px; font-weight:700; fill:#fff;">4</text>
  <text x="291" y="422" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:12px; font-weight:600; fill:#27272A;">Total End Users</text>
  <text x="291" y="442" style="font-size:18px; font-weight:400; fill:#5B21B6;">13.5M children</text>

  <!-- Arrow + multiplier -->
  <line x1="380" y1="454" x2="380" y2="473" stroke="#D4D4D8" stroke-width="1"/>
  <polygon points="374,471 380,480 386,471" fill="#D4D4D8"/>
  <text x="400" y="471" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:13px; font-weight:600; fill:#3F3F46;">× $260.88/child</text>

  <!-- Result -->
  <rect x="260" y="485" width="240" height="48" rx="4" fill="#5B21B6"/>
  <text x="380" y="505" text-anchor="middle" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:10px; font-weight:500; fill:rgba(255,255,255,0.65); letter-spacing:0.1em;">ANNUAL US SAM</text>
  <text x="380" y="526" text-anchor="middle" style="font-size:22px; font-weight:400; fill:#FFFFFF; letter-spacing:-0.02em;">≈ $3.5 Billion</text>

  <!-- Revenue callout -->
  <rect x="530" y="485" width="190" height="48" rx="4" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="0.5"/>
  <text x="545" y="503" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:10px; font-weight:600; fill:#3F3F46;">Revenue per child</text>
  <text x="545" y="518" font-family="'IBM Plex Mono', monospace" style="font-size:9px; fill:#71717A;">$129 hardware (one-time)</text>
  <text x="545" y="530" font-family="'IBM Plex Mono', monospace" style="font-size:9px; fill:#71717A;">$131.88/yr subscription</text>

  <!-- Footer -->
  <line x1="50" y1="543" x2="710" y2="543" stroke="#E4E4E7" stroke-width="0.5"/>
  <text x="50" y="555" font-family="'DM Sans', 'Outfit', system-ui, sans-serif" style="font-size:9px; fill:#A1A1AA; letter-spacing:0.1em;">MPD CAPSTONE GUIDE</text>
  <text x="710" y="555" text-anchor="end" font-family="'IBM Plex Mono', monospace" style="font-size:9px; fill:#A1A1AA;">03 / Case Study</text>
</svg>